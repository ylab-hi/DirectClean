[tool.poetry]
name = "directclean"
version = "0.1.0"
description = "Remove RT artifacts from Direct-cDNA sequencing"
authors = ["Qingxiang Guo <qingxiang.guo@northwestern.edu>"]
license = "MIT"
readme = "README.md"
packages = [{include = "directclean", from = "src"}]
include = ["src/directclean/external/configs/*.json"]

[tool.poetry.dependencies]
python = "^3.10"
pysam = ">=0.21.0"
biopython = ">=1.81"
typer = {extras = ["all"], version = ">=0.9.0"}
rich = ">=13.0.0"
edlib = ">=1.3.9"

[tool.poetry.scripts]
directclean = "directclean.cli.app:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"